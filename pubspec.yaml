name: sk_attendance_hub

description: SK Attendance Hub - Staff Attendance View and Attendance Marking

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.5.0
  mobile_scanner: ^7.4.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/sk_new_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/sk_new_logo.png